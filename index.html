:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font:inherit;color:inherit}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif}
h1{font-size:32px;line-height:1.08;letter-spacing:-.02em;font-weight:800;margin:10px 0 2px}
h2{font-size:21px;font-weight:800;letter-spacing:-.01em;margin:22px 0 10px}
h3{font-size:18px;font-weight:700;margin:0;letter-spacing:-.005em}
small,.sub{color:var(--muted);font-size:13.5px}
p{margin:0}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 120px}
.lead{color:var(--muted);margin-bottom:14px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;width:100%;border-radius:16px;font-weight:700;font-size:17px;background:var(--plum);color:var(--plum-ink)}
.btn.pop{background:var(--pop);color:var(--pop-ink)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.sm{height:42px;font-size:15px;border-radius:12px}
.btn[disabled]{opacity:.4}
.mini{height:34px;padding:0 12px;border-radius:10px;background:var(--soft);font-weight:600;font-size:14px}
.icon{width:42px;height:42px;border-radius:14px;background:var(--soft);display:grid;place-items:center;flex:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;height:42px;border-radius:10px;color:var(--muted);font-weight:700}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.lab{font-weight:700;margin:16px 0 8px}

/* home */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.week{display:flex;justify-content:space-between;margin:14px 0 4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.wd i{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:#fff;font-style:normal}
.wd.has i{background:var(--ok);border-color:var(--ok)}
.wd.today i{border-color:var(--pop);border-width:2px}
.banner{border-radius:16px;padding:14px;background:var(--warn-bg);margin:12px 0}
.banner b{display:block;margin-bottom:2px}
.banner .two{margin-top:10px}
.hero{background:var(--plum);color:var(--plum-ink);border-radius:28px;padding:20px 18px 18px;margin:14px 0 8px}
.hero .sm2{opacity:.75;font-size:14px}
.hero h2{font-size:34px;line-height:1.05;letter-spacing:-.02em;margin:6px 0 2px;color:var(--plum-ink)}
.hero .tag{opacity:.8;font-size:15px;margin-bottom:12px}
.hero ul{list-style:none;margin:0 0 16px;padding:0}
.hero li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid rgba(127,127,127,.3);font-size:15.5px}
.hero li span:last-child{opacity:.8;white-space:nowrap}
.hero .btn{background:var(--pop);color:var(--pop-ink)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:8px}
.row b{display:block}
.row em{font-style:normal;font-weight:700;font-size:13px;background:var(--pop);color:var(--pop-ink);border-radius:999px;padding:3px 10px}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:14px;padding:12px 14px;margin:12px 0;font-size:14px}
.tip button{flex:none;font-weight:700;color:var(--pop)}

/* pick */
.build{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;border-radius:22px;padding:18px;background:var(--plum);color:var(--plum-ink)}
.build h3{font-size:22px;color:var(--plum-ink)}
.build small{color:var(--plum-ink);opacity:.75}
.q{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.q.glute{border-left:5px solid var(--pop)}
.q .qh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.q .two{margin-top:12px}

/* chips + library */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.chip.on{background:var(--plum);border-color:var(--plum);color:var(--plum-ink)}
.search{width:100%;height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;margin-bottom:8px;font-size:16px}
.lib{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line)}
.lib b{display:block;font-weight:600}
.lib .add{width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none;font-size:22px;line-height:1}
.lib.on .add{background:var(--ok);color:#fff}
.sel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px}
.sel .sh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sel .ctl{display:flex;align-items:center;gap:8px;margin-top:10px}
.sel .ctl input{height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);text-align:center;font-size:16px;font-weight:700}
.sel .ctl .n{width:56px}.sel .ctl .rr{width:84px}
.sel .ctl .sp{flex:1}
.bbar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.bbar .btn{max-width:528px;margin:0 auto}
.nameIn{flex:1;height:42px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-weight:700;font-size:17px;min-width:0}

/* workout */
.whead{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:8px 0 10px}
.whead .wt{flex:1;min-width:0}
.whead .wt b{display:block;font-family:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.whead .fin{height:42px;padding:0 18px;border-radius:14px;background:var(--pop);color:var(--pop-ink);font-weight:700}
.prog{height:4px;background:var(--soft);border-radius:4px;margin-bottom:12px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:4px;transition:width .25s}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 12px 12px;margin-bottom:14px}
.exh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:0 2px 8px}
.exa{display:flex;gap:6px;flex:none}
.hint{background:var(--warn-bg);border-radius:12px;padding:9px 12px;font-size:14px;margin:0 0 8px}
.set,.setlab{display:grid;grid-template-columns:26px 1fr 78px 66px 46px;gap:8px;align-items:center}
.set.nw,.setlab.nw{grid-template-columns:26px 1fr 86px 46px}
.setlab{font-size:12.5px;color:var(--muted);text-align:center;padding-bottom:4px}
.set{margin-bottom:8px}
.sn{font-weight:700;color:var(--muted);text-align:center}
.prev{font-size:14px;color:var(--muted);text-align:center;white-space:nowrap}
.in{width:100%;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);text-align:center;font:700 18px "Bricolage Grotesque","Avenir Next",system-ui,sans-serif;color:var(--ink);padding:0}
.in:focus{outline:2px solid var(--pop);outline-offset:1px}
.chk{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.set.done .in{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.set.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.exf{display:flex;gap:8px;padding-top:2px}
.tbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;align-items:center;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--plum);color:var(--plum-ink)}
.tbar .tl{flex:1;display:flex;flex-direction:column;line-height:1.15}
.tbar .tl span{font-size:13px;opacity:.8}
.tbar .tl b{font-family:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;font-size:28px}
.tbar button{height:42px;padding:0 14px;border-radius:12px;background:rgba(127,127,127,.25);font-weight:700;color:var(--plum-ink)}

/* history + records */
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stat3 div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center}
.stat3 b{display:block;font-family:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;font-size:26px;letter-spacing:-.01em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.card .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left}
.card ul{list-style:none;padding:0;margin:10px 0 0}
.card li{padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.card li small{display:block}
.pb{display:flex;gap:10px;align-items:center;background:var(--warn-bg);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.empty{text-align:center;color:var(--muted);padding:36px 16px}

/* tabs + sheet */
.tabs{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);padding:4px 0}
.tabs button.on{color:var(--pop)}
.sheetbg{position:fixed;inset:0;z-index:60;background:rgba(12,6,18,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 12px}
.sheet textarea{width:100%;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:10px;font-size:14px;margin-bottom:8px}
.danger{color:var(--pop);font-weight:700}
/* body + goals */
.big{font-family:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1}
.big span{font-size:20px;font-weight:700;color:var(--muted);margin-left:4px}
.delta{display:flex;flex-wrap:wrap;gap:4px 14px;margin:8px 0 4px;font-size:14px;color:var(--muted)}
.delta b{color:var(--ink)}
.chart{width:100%;height:auto;display:block;margin:12px 0 4px}
.crow{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.entry{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry span{display:flex;align-items:center;gap:6px}
.entry button{color:var(--muted);padding:6px}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.goal .gh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.goal .gf{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--pop);border-radius:6px;transition:width .4s}
.goal.done .bar i{background:var(--ok)}
.gpill{font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--soft);white-space:nowrap}
.goal.done .gpill{background:var(--ok-bg);color:var(--ok)}
.glink{font-size:14px;margin:0 0 8px;padding:8px 12px;border-radius:12px;background:var(--soft)}
.field{width:100%;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 12px;font-size:17px;margin:4px 0 10px;color:var(--ink)}
select.field{appearance:none;-webkit-appearance:none}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f2>*{min-width:0}
.sheetbg.center{align-items:center;padding:20px}
.sheet.cheer{border-radius:28px;text-align:center;padding:28px 22px 20px;max-width:380px}
.cheer .em{font-size:60px;line-height:1;display:block;margin-bottom:10px}
.sheetbg.enter .cheer .em{animation:popin .5s .08s cubic-bezier(.2,1.4,.4,1) both}
.cheer h2{font-size:26px;margin:0 0 8px}
.cheer p{color:var(--muted);margin-bottom:18px}
.sws{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.swb{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.swb i{width:40px;height:40px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line)}
.swb.on i{box-shadow:0 0 0 2.5px var(--ink)}
.swb.on{color:var(--ink);font-weight:700}
.cpick{display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-weight:600}
.cpick input{width:64px;height:40px;border:1.5px solid var(--line);border-radius:10px;background:none;padding:2px}
.bar.dual{position:relative}
.bar.dual i{position:absolute;left:0;top:0;bottom:0}
.bar.dual i.a{background:var(--ok)}
.bar.dual i.b{background:var(--pop)}
.tagc{font-size:13px;font-weight:700;white-space:nowrap;color:var(--muted)}
.tagc.up{color:var(--ok)}
.card .hl{list-style:none;margin:0;padding:0}
.card .hl li{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.card .hl li:first-child{border-top:0;padding-top:2px}
.card .hl li span:first-child{flex:none}
.card .bk li:first-child{border-top:0}
.cal{padding:12px 10px}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.calh .icon{width:36px;height:36px}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cw{font-size:12px;color:var(--muted);padding:4px 0}
.cd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 0;border-radius:12px}
.cd span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px}
.cd.w span{background:var(--pop);color:var(--pop-ink);font-weight:700}
.cd.td span{box-shadow:inset 0 0 0 2px var(--ink)}
.cd.sel{background:var(--soft)}
.cd i{height:6px;display:flex;justify-content:center}
.cd em,.calk em{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block}
.calk{display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--muted);margin-top:8px}
.calk b{width:12px;height:12px;border-radius:50%;background:var(--pop);display:inline-block;vertical-align:-1px;margin-right:2px}
/* food */
.fnav{display:flex;align-items:center;justify-content:space-between;margin:12px 0 10px}
.fnav .icon{width:38px;height:38px}
.fnav b{font-family:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;font-size:18px}
.fsum{padding:16px}
.fbig{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.fleft{text-align:right}
.fleft b{display:block;font-family:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;font-size:26px;line-height:1.1}
.fprot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:12px;font-size:15px}
.bar.ok i{background:var(--ok)}
.meal ul{margin-top:8px}
.card.meal li{padding:0}
.fent{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 0}
.fent b{display:block;font-weight:600}
.fk{font-weight:700;white-space:nowrap}
.fprev{display:flex;flex-wrap:wrap;gap:4px 14px;background:var(--soft);border-radius:12px;padding:12px 14px;margin:4px 0 6px;font-size:15px;color:var(--muted)}
.fprev b{flex-basis:100%;font-family:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;font-size:22px;color:var(--ink)}
.btn svg{flex:none}
/* ---------- app polish ---------- */
:root{--sun:#E0832B;--track:#E7E1EE;--shadow:0 1px 1px rgba(40,20,55,.04),0 8px 24px -12px rgba(40,20,55,.22);--glass:rgba(255,255,255,.8);--glow:rgba(217,58,116,.10)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sun:#F3A35C;--track:#2E2338;--shadow:0 0 0 1px #2E2338;--glass:rgba(28,20,35,.82);--glow:rgba(255,107,151,.10)}}
:root[data-theme="dark"]{--sun:#F3A35C;--track:#2E2338;--shadow:0 0 0 1px #2E2338;--glass:rgba(28,20,35,.82);--glow:rgba(255,107,151,.10)}
body{background:radial-gradient(130% 420px at 50% -120px,var(--glow),transparent 70%) no-repeat,var(--bg)}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--pop);outline-offset:2px}
.btn,.row,.mini,.chip,.icon,.lib,.fent,.build,.chk,.lgi,.gi,.pd,.link,.tile,.seg button{transition:transform .14s ease,background-color .2s,opacity .2s,box-shadow .2s}
:is(.btn,.row,.mini,.chip,.icon,.lib,.fent,.build,.chk,.lgi,.gi,.pd,.link):active{transform:scale(.97)}
.card,.row,.goal,.q,.sel,.ex,.stat3 div{border-color:transparent;box-shadow:var(--shadow)}
.card,.goal,.q,.sel{border-radius:20px}
.row{border-radius:16px}
.eyebrow{display:block;text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:700;color:var(--muted)}
.home h1{font-size:34px;margin-top:4px}
.home .top{align-items:center;padding-top:4px}
h2{text-wrap:balance}
/* tab bar */
.tabs{background:var(--glass);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-right,0px))}
.tabs button{position:relative;isolation:isolate;gap:3px;font-size:11px}
.tabs button svg{transition:transform .2s}
.tabs button.on::before{content:"";position:absolute;z-index:-1;top:1px;left:50%;width:52px;height:32px;margin-left:-26px;border-radius:999px;background:color-mix(in srgb,var(--pop) 15%,transparent)}
.tabs button.on svg{transform:translateY(-1px)}
/* view + sheet motion */
#app>.enter{animation:viewIn .34s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sheetbg.enter{animation:fadeIn .22s ease}
.sheetbg.enter .sheet{animation:sheetUp .34s cubic-bezier(.2,.9,.25,1)}
.sheetbg.enter .sheet.cheer{animation:popin .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes fadeIn{from{opacity:0}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4}}
.sheet{box-shadow:0 -10px 40px -10px rgba(12,6,18,.35)}
.sheet:not(.cheer)::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 14px}
/* today rings */
.glance{padding:18px 16px 12px}
.tw{display:grid;grid-template-columns:minmax(0,132px) minmax(0,1fr);gap:16px;align-items:center}
.rings{width:100%;height:auto;display:block}
.rings.anim .arc{animation:ringIn 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}}
.legend{display:grid;gap:4px;min-width:0}
.lgi{display:flex;gap:10px;align-items:center;text-align:left;padding:5px 0;width:100%}
.lgi i{width:10px;height:10px;border-radius:50%;flex:none}
.lgi span{min-width:0;display:flex;flex-direction:column}
.lgi small{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

function inkFor(hex){const h=String(hex).replace('#','');if(h.length<6)return '#FFFFFF';const ch=[0,2,4].map(i=>{const c=parseInt(h.substr(i,2),16)/255;return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4)});const L=.2126*ch[0]+.7152*ch[1]+.0722*ch[2];return L>.42?'#1E1424':'#FFFFFF'}

/* ---------- logic helpers ---------- */
const parseRange=r=>{const m=String(r).match(/\d+/g)||['10'];return [+m[0],+(m[1]||m[0])]};
const rangeLabel=r=>String(r).replace(/-/g,'–');
const dayKey=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
const fdate=iso=>new Date(iso).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
const e1=(w,r)=>w>0?w*(1+r/30):0;
const parseW=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n};
const unitLabel=x=>x.unit==='s'?'sec':x.unit==='min'?'min':'reps';
const targetLabel=(x,s,r)=>`${s} × ${rangeLabel(r)}${x.unit==='s'?' sec':x.unit==='min'?' min':''}${x.each?' each side':''}`;

function weekNo(){if(!S.start)return 1;const f=new Date(S.start);f.setHours(0,0,0,0);return Math.floor((Date.now()-f.getTime())/(7*864e5))+1}
const isDeloadOn=()=>S.deloadFor===weekNo();
const deloadDue=()=>weekNo()%6===0&&S.deloadFor!==weekNo()&&S.deloadSkip!==weekNo();

function lastLog(id){for(let i=S.logs.length-1;i>=0;i--){const l=S.logs[i];const e=l.ex.find(x=>x.id===id);if(e&&e.sets.length)return {log:l,ex:e}}return null}
function bestOf(id){let w=0,e=0,any=false;S.logs.forEach(l=>l.ex.forEach(x=>{if(x.id!==id)return;any=true;x.sets.forEach(s=>{w=Math.max(w,+s.w||0);e=Math.max(e,e1(+s.w||0,+s.r||0))})}));return any?{w,e}:null}

function suggest(id,n,range,light){
  const x=E[id],[lo,hi]=parseRange(range),L=lastLog(id),sets=[];
  const mk=(w,r)=>({w:(w===''||w==null)?'':fmt(w),r:String(r),d:false});
  if(!L){for(let i=0;i<n;i++)sets.push(mk('',lo));return {sets,note:x.nw?'':'First time logging this one. Start light and keep the last rep clean.'}}
  const prev=L.ex.sets,maxW=Math.max(...prev.map(s=>+s.w||0));
  const pv=i=>prev[Math.min(i,prev.length-1)];
  if(x.nw){for(let i=0;i<n;i++)sets.push(mk('',pv(i).r));return {sets,note:''}}
  if(light&&maxW>0){for(let i=0;i<n;i++)sets.push(mk(Math.round((+pv(i).w||0)*0.6*2)/2,lo));return {sets,note:'Light day: weights are about 60% of last time.'}}
  const hitTop=maxW>0&&prev.length>=n&&prev.every(s=>(+s.r||0)>=hi);
  if(hitTop){const w=maxW+x.inc;for(let i=0;i<n;i++)sets.push(mk(w,lo));return {sets,note:`You hit ${hi} reps on every set last time. Try ${fmt(w)} kg today.`}}
  for(let i=0;i<n;i++){const p=pv(i);sets.push(mk(+p.w||'',p.r))}
  return {sets,note:''}
}

function makeWorkout(name,items,meta){
  meta=meta||{};
  const light=!!meta.light||isDeloadOn();
  return Object.assign({name,src:'pick',start:Date.now()},meta,{light,ex:items.filter(it=>E[it.id]).map(it=>{const sg=suggest(it.id,it.s,it.r,light);return {id:it.id,s:it.s,r:it.r,note:sg.note,sets:sg.sets}})});
}
function begin(w){
  if(W&&W.ex.some(e=>e.sets.some(s=>s.d))){
    UI.sheet={type:'confirm',msg:'You have a workout in progress with sets logged. Start a new one and discard it?',yes:'Start new',fn:()=>go(w)};renderSheet();return;
  }

}
function go(w){W=w;saveW();T=null;UI.view='workout';UI.sheet=null;wake();render()}
function discard(){W=null;saveW();T=null;unwake();UI.view='home'}

function elapsed(){if(!W)return '0:00';const s=Math.floor((Date.now()-W.start)/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(c).padStart(2,'0')}

function finishWorkout(){
  const ex=W.ex.map(e=>({id:e.id,sets:e.sets.filter(s=>s.d).map(s=>({w:parseW(s.w),r:+s.r||0}))})).filter(e=>e.sets.length);
  const pbs=[];
  ex.forEach(e=>{
    const x=E[e.id];if(x.nw)return;
    const p=bestOf(e.id);if(!p)return;
    let bs=null,be=0;e.sets.forEach(s=>{const v=e1(s.w,s.r);if(v>be){be=v;bs=s}});
    const mw=Math.max(...e.sets.map(s=>s.w));
    if(mw>0&&(mw>p.w||be>p.e+0.01))pbs.push({name:x.name,w:bs.w,r:bs.r});
  });
  const now=new Date();
  const log={id:Date.now().toString(36),date:now.toISOString(),name:W.name,dur:Math.min(240,Math.max(1,Math.round((Date.now()-W.start)/60000))),ex};
  log.started=new Date(W.start).toISOString();
  const X=preStats(log);
  if(!S.start)S.start=log.date;
  S.logs.push(log);
  if(W.src==='plan'){const n=PROGRAMS[W.prog].days.length;S.next[W.prog]=(W.dayIdx+1)%n}
  const reached=[];S.goals.forEach(g=>{if(!g.done&&g.type==='lift'&&bestAtReps(g.ex,g.r)>=g.w){g.done=todayISO();reached.push(g)}});
  const wg=S.goals.find(g=>g.type==='week'),weekHit=!!wg&&weekCount()===wg.n;
  const sets=ex.reduce((a,e)=>a+e.sets.length,0),vol=ex.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+s.w*s.r,0),0);
  save();W=null;saveW();T=null;unwake();
  UI.done={log,pbs,sets,vol,reached,X:postStats(X,log)};UI.view='done';
  if(reached.length)UI.sheet={type:'cheer',em:'🏆',title:reached.length>1?'Goals reached!':'Goal reached!',msg:kid(reached.map(g=>goalInfo(g).title).join(', ')+'. All that work paid off.','strong')};
  else if(weekHit)UI.sheet={type:'cheer',em:'🔥',title:'Weekly goal done',msg:kid(`That’s ${wg.n} workouts this week, exactly what you set out to do.`,'proud')};
  else if(pbs.length)UI.sheet={type:'cheer',em:'⭐',title:pbs.length>1?pbs.length+' new personal bests':'New personal best',msg:kid(pbs.map(p=>p.name).join(', ')+'. You’re getting stronger.','strong')};
  render();
}

function ensureAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}

  if(AC){[0,.28].forEach(d=>{try{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+d;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.start(t);o.stop(t+.25)}catch(e){}})}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
}

function tickText(){const l=$('#tleft');if(l&&T&&!T.over){const s=Math.max(0,Math.ceil((T.end-Date.now())/1000));l.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}}

}

  else if(T&&T.over&&Date.now()>T.hideAt){T=null;renderTimer()}

},250);

const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fday=s=>new Date(s+'T12:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
const metric=id=>S.metrics.find(m=>m.id===id);
const ents=id=>(S.entries[id]||[]).slice().sort((a,b)=>a.d.localeCompare(b.d));
const latest=id=>{const e=ents(id);return e.length?e[e.length-1].v:null};
const fv=v=>fmt(Math.round(v*10)/10);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function bestAtReps(id,r){let b=0;S.logs.forEach(l=>l.ex.forEach(e=>{if(e.id===id)e.sets.forEach(s=>{if((+s.r||0)>=r)b=Math.max(b,+s.w||0)})}));return b}
function weekCount(){const now=new Date(),dow=(now.getDay()+6)%7,mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow);return S.logs.filter(l=>new Date(l.date)>=mon).length}
function addMetric(n,u){const f=S.metrics.find(m=>m.name.toLowerCase()===n.toLowerCase());if(f)S.bodySel=f.id;else{const id='m'+Date.now().toString(36);S.metrics.push({id,name:n,unit:u});S.bodySel=id}save();UI.sheet=null;UI.view='body';render()}

function goalInfo(g){
  if(g.type==='week'){const c=weekCount();return {title:`${g.n} workouts a week`,cur:`${c} of ${g.n} done this week`,pct:Math.min(1,c/g.n),hit:c>=g.n}}
  if(g.type==='lift'){const x=E[g.ex],cur=bestAtReps(g.ex,g.r),st=g.start||0;const pct=g.w<=st?(cur>=g.w?1:0):Math.max(0,Math.min(1,(cur-st)/(g.w-st)));
    return {title:`${x?x.name:'Exercise'}: ${fmt(g.w)} kg × ${g.r}`,cur:cur>0?`Best so far: ${fmt(cur)} kg for ${g.r}+ reps`:`No sets of ${g.r}+ reps logged yet`,pct:g.done?1:pct,hit:cur>=g.w}}
  const m=metric(g.metric)||{name:'Measurement',unit:''},e=ents(g.metric),cur=latest(g.metric),st=g.start!=null?g.start:(e.length?e[0].v:null);
  let pct=0,hit=false;
  if(cur!=null&&st!=null){pct=g.target===st?1:Math.max(0,Math.min(1,(cur-st)/(g.target-st)));hit=g.target>=st?cur>=g.target:cur<=g.target}
  return {title:`${m.name}: ${fv(g.target)} ${m.unit}`,cur:cur==null?'No entries yet':`Now ${fv(cur)} ${m.unit}, started at ${fv(st)}`,pct:g.done?1:pct,hit};
}
function goalCard(g,del){

  const pill=g.done?'Achieved':wk?(i.hit?'Done this week':'This week'):Math.round(i.pct*100)+'%';
  const foot=g.done?'Achieved '+fday(g.done):wk?'Resets every Monday':due==null?'No deadline':due>1?due+' days left':due===1?'1 day left':due===0?'Due today':'Deadline was '+fday(g.due);

}
function goalLine(id){const g=S.goals.find(g=>!g.done&&g.type==='lift'&&g.ex===id);if(!g)return '';const b=bestAtReps(id,g.r);return `<p class="glink">🎯 Goal: ${fmt(g.w)} kg × ${g.r}. ${b>0?`Your best for ${g.r}+ reps is ${fmt(b)} kg.`:`You haven’t logged ${g.r}+ reps on this yet.`}</p>`}

/* Florence and Theo */

const ord=n=>{const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};

const PRESETS=[['Plum','#3B1E4F','#D93A74'],['Ocean','#14385C','#2BA3C7'],['Forest','#1F4033','#E0A23A'],['Berry','#5B1035','#F07AA0'],['Lilac','#6B4FA0','#F2A6C8'],['Mono','#26232A','#8C8494']];

function cheerFor0(id,v,date){
  const m=metric(id),e=ents(id),i=e.findIndex(x=>x.d===date),prev=i>0?e[i-1]:null,u=m.unit;
  if(!prev)return {em:'🌱',title:'Starting point set',msg:`${m.name} logged at ${fv(v)} ${u}. Every future entry gets compared with this one.`};
  const g=S.goals.find(x=>!x.done&&x.type==='body'&&x.metric===id);
  const d=Math.round((v-prev.v)*10)/10,abs=fv(Math.abs(d)),dir=d>0?'Up':'Down';
  let want=0;if(g){const st=g.start!=null?g.start:e[0].v;want=Math.sign(g.target-st)}
  if(d===0)return {em:'⚖️',title:'Holding steady',msg:pick(['Same as last time. Steady and consistent is how progress gets built.','No change since last time, which is completely normal. Keep showing up.'])};
  if(want!==0&&Math.sign(d)===want)return {em:'🎯',title:`${dir} ${abs} ${u}`,msg:pick([`That’s a step toward your goal of ${fv(g.target)} ${u}.`,`Moving the right way. ${fv(Math.abs(g.target-v))} ${u} to go.`,`Nice. Your goal of ${fv(g.target)} ${u} is getting closer.`])};
  if(want!==0)return {em:'🌤️',title:`${dir} ${abs} ${u}`,msg:pick(['Numbers bounce around day to day with water, food and training. The trend over weeks is what counts.','One reading never tells the whole story. Keep training and logging, and the trend will show your progress.'])};
  if(id==='weight')return d>0?{em:'💪',title:`Up ${abs} ${u}`,msg:pick(['Gaining is part of building lean muscle. Your training is giving it somewhere to go.','A little more on the scale plus consistent lifting is how muscle gets built. Keep fuelling those sessions.'])}:{em:'🌿',title:`Down ${abs} ${u}`,msg:pick(['Small dips are normal. While you’re building muscle, keep your food and protein up so your training has fuel.','The scale moves around. Keep eating well and lifting, and watch the trend over a few weeks.'])};
  return {em:'✨',title:`${dir} ${abs} ${u}`,msg:pick(['Logged. Tracking it regularly is what makes the trend useful.','Another data point in. Patterns show up over weeks, so keep it going.'])};
}

function chartSVG(id){

    const bestTxt=x.nw?`${best.r} ${unitLabel(x)}`:`${best.w?fmt(best.w)+' kg':'BW'} × ${best.r}`;

function byCode(code){
  code=String(code).replace(/\D/g,'');if(!code)return null;
  const vs=[code,code.replace(/^0+/,''),'0'+code,code.length===12?'0'+code:code];
  for(const v of vs){const c=S.food.custom.find(x=>x.code&&x.code.replace(/^0+/,'')===v.replace(/^0+/,''));if(c)return fc(c)}

function foodSearch(q){
  q=q.trim().toLowerCase();const toks=q.split(/\s+/).filter(Boolean);
  if(!toks.length)return {list:S.food.recent.slice(0,30),recent:true};
  if(/^\d{6,14}$/.test(q)){const f=byCode(q);return {list:f?[f]:[],code:q}}
  const m=s=>toks.every(t=>s.includes(t)),ws=s=>toks.every(t=>s.startsWith(t)||s.includes(' '+t)||s.includes('-'+t)||s.includes('('+t));
  const c=[];
  S.food.custom.forEach(x=>{const l=(x.name+' '+(x.brand||'')).toLowerCase();if(m(l))c.push({f:fc(x),s:3+ws(l),o:0})});
  for(let i=0;i<AFCD.length;i++){const l=AFCD_L[i];if(m(l))c.push({f:i,a:1,s:ws(l)*2+(l.startsWith(toks[0])?1:0),o:l.length})}
  if(PROD){let n=0;for(let i=0;i<PROD.length&&n<400;i++){const l=PROD_L[i];if(m(l)){c.push({f:i,p:1,s:ws(l)*2+(l.startsWith(toks[0])?.5:0),o:i/1e6});n++}}}
  c.sort((x,y)=>(y.s-x.s)||(x.o-y.o));
  const rec=new Set(S.food.recent.map(r=>r.k));
  const out=c.slice(0,70).map(x=>x.a?fa(x.f):x.p?fp(PROD[x.f]):x.f);
  out.sort((x,y)=>rec.has(y.k)-rec.has(x.k));
  return {list:out};
}

function loadZX(){if(window.ZXing)return Promise.resolve();if(ZXP)return ZXP;ZXP=loadScript('zxing.min.js').catch(e=>{ZXP=null;throw e});return ZXP}
async function imgFromFile(file){
  try{if(window.createImageBitmap)return await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){}
  return await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)});
}
async function decodeBarcode(file){
  const img=await imgFromFile(file);
  if('BarcodeDetector' in window){try{const bd=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});const r=await bd.detect(img);if(r&&r[0])return r[0].rawValue}catch(e){}}
  await loadZX();const Z=window.ZXing;
  const hints=new Map();hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E]);hints.set(Z.DecodeHintType.TRY_HARDER,true);
  const reader=new Z.MultiFormatReader();reader.setHints(hints);
  const W0=img.width,H0=img.height;
  for(const max of [1200,800,1800])for(const rot of [0,90]){
    const sc=Math.min(1,max/Math.max(W0,H0)),w=Math.round(W0*sc),h=Math.round(H0*sc);
    const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
    if(rot){cv.width=h;cv.height=w;cx.translate(h,0);cx.rotate(Math.PI/2)}else{cv.width=w;cv.height=h}
    cx.drawImage(img,0,0,w,h);
    const d=cx.getImageData(0,0,cv.width,cv.height).data,n=cv.width*cv.height,gray=new Uint8ClampedArray(n);
    for(let i=0,j=0;i<n;i++,j+=4)gray[i]=(d[j]*306+d[j+1]*601+d[j+2]*117)>>10;
    try{const bm=new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.RGBLuminanceSource(gray,cv.width,cv.height)));return reader.decode(bm).getText()}catch(e){}
    try{reader.reset()}catch(e){}
  }
  return null;
}

/* backup */
function backupText(){return `Lift backup, ${new Date().toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'})}\nTo restore: Lift > Settings > paste this whole note > Restore from text.\n`+JSON.stringify(Object.assign({},S,{lastBackup:todayISO(),backupSnooze:null}))}
function hasData(){return S.logs.length||Object.values(S.entries).some(a=>a.length)||Object.keys(S.food.log).length}
function backupDue(){if(!hasData())return false;const t=todayISO();if(S.backupSnooze&&t<S.backupSnooze)return false;if(!S.lastBackup)return true;return (new Date(t)-new Date(S.lastBackup))/864e5>=30}
function copyBackup(){
  const txt=backupText();
  const ok=()=>{S.lastBackup=todayISO();S.backupSnooze=null;save();UI.sheet={type:'bkdone'};renderSheet();if(UI.view==='home')render()};
  const fail=()=>{UI.sheet={type:'bkmanual',txt};renderSheet();const ta=$('#bkm');if(ta){ta.focus();ta.select()}};

}

  if(k==='ledur'){L.dur=t.value;return true}

function ringsSVG(rs,anim){

  return `<svg class="rings${anim?' anim':''}" viewBox="0 0 132 132" aria-hidden="true">`+rs.map((r,i)=>{
    const c=2*Math.PI*R[i],p=Math.max(0,Math.min(1,r.t>0?r.v/r.t:0)),off=c*(1-p);
    return `<circle cx="66" cy="66" r="${R[i]}" fill="none" stroke="${r.col}" stroke-opacity=".16" stroke-width="${sw}"/>`+
      (p>0?`<circle class="arc" cx="66" cy="66" r="${R[i]}" fill="none" stroke="${r.col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" style="--c:${c.toFixed(1)};animation-delay:${i*110}ms" transform="rotate(-90 66 66)"/>`:'')+
      (r.limit&&r.t>0&&r.v>r.t?(()=>{const q=Math.min(1,(r.v-r.t)/r.t),o2=c*(1-q);return `<circle class="arc ov" cx="66" cy="66" r="${R[i]}" fill="none" stroke="var(--over)" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${o2.toFixed(1)}" style="--c:${c.toFixed(1)};animation-delay:${i*110+900}ms" transform="rotate(-90 66 66)"/>`})():'');
  }).join('')+`</svg>`;

function donut(p,col,size){
  const r=15,c=2*Math.PI*r,o=c*(1-Math.max(0,Math.min(1,p)));
  return `<svg class="donut" viewBox="0 0 40 40" width="${size||44}" height="${size||44}" aria-hidden="true"><circle cx="20" cy="20" r="${r}" fill="none" stroke="${col}" stroke-opacity=".16" stroke-width="5"/>${p>0?`<circle cx="20" cy="20" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${o.toFixed(1)}" transform="rotate(-90 20 20)"/>`:''}</svg>`;

function trendSVG(e,goal){
  const w=320,h=104,pl=4,pr=4,pt=12,pb=8;
  const t0=new Date(e[0].d).getTime(),t1=new Date(e[e.length-1].d).getTime();
  let vs=e.map(x=>x.v);if(goal!=null)vs=vs.concat(goal);
  let mn=Math.min(...vs),mx=Math.max(...vs);const pad=Math.max(.5,(mx-mn)*.15);mn-=pad;mx+=pad;
  const X=t=>pl+(t1===t0?.5:(t-t0)/(t1-t0))*(w-pl-pr),Y=v=>pt+(1-(v-mn)/(mx-mn))*(h-pt-pb);
  const pts=e.map(x=>[X(new Date(x.d).getTime()),Y(x.v)]);
  let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i],cx=(x0+x1)/2;d+=` C${cx.toFixed(1)} ${y0.toFixed(1)} ${cx.toFixed(1)} ${y1.toFixed(1)} ${x1.toFixed(1)} ${y1.toFixed(1)}`}
  const last=pts[pts.length-1],area=d+` L${last[0].toFixed(1)} ${h} L${pts[0][0].toFixed(1)} ${h} Z`;
  const gy=goal!=null?Y(goal):null;
  return `<svg class="trend" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="wfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--pop)" stop-opacity=".28"/><stop offset="1" stop-color="var(--pop)" stop-opacity="0"/></linearGradient></defs>
  ${[.25,.5,.75].map(f=>`<line x1="0" x2="${w}" y1="${(pt+f*(h-pt-pb)).toFixed(1)}" y2="${(pt+f*(h-pt-pb)).toFixed(1)}" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join('')}
  ${gy!=null?`<line x1="0" x2="${w}" y1="${gy.toFixed(1)}" y2="${gy.toFixed(1)}" stroke="var(--ok)" stroke-width="1.5" stroke-dasharray="5 5" vector-effect="non-scaling-stroke"/>`:''}
  <path d="${area}" fill="url(#wfill)"/><path d="${d}" fill="none" stroke="var(--pop)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>
  <span class="tdot" style="left:${(last[0]/w*100).toFixed(2)}%;top:${(last[1]/h*100).toFixed(2)}%"></span>`;
}

  <div class="ctl"><input class="n" inputmode="numeric" data-in="bs" data-i="${i}" value="${it.s}" aria-label="Sets"><span>sets of</span><input class="rr" data-in="br" data-i="${i}" value="${esc(it.r)}" aria-label="Reps"><span>${unitLabel(x)}${x.each?', each side':''}</span></div></div>`}).join(''):`<div class="empty" style="padding:20px 10px">Nothing here yet. Tap exercises below to add them.</div>`;
  return `<div class="wrap" style="padding-bottom:140px"><div class="top" style="align-items:center;gap:10px"><button class="icon" data-a="bback" aria-label="Back">${svg(ico.back)}</button><input class="nameIn" data-in="bname" value="${esc(B.name)}" aria-label="Workout name"></div>
  <h2>Your workout</h2>${sel}<h2>Add exercises</h2>${chipsHTML()}<input class="search" type="search" placeholder="Search exercises" data-in="q" value="${esc(UI.q)}"><button class="btn sm ghost" data-a="cexopen" data-ctx="b" style="margin-bottom:6px">Create your own exercise</button><div id="lib" data-ctx="b">${libHTML('b')}</div></div>
  <div class="bbar"><div class="bb2"><button class="btn ghost" data-a="tplsave" ${B.items.length?'':'disabled'}>${B.tid?'Save changes':'Save template'}</button><button class="btn pop" data-a="bstart" ${B.items.length?'':'disabled'}>Start${B.items.length?' ('+B.items.length+')':''}</button></div></div>`;
}

function exCard(e,i){
  const x=E[e.id],L=lastLog(e.id),nw=x.nw;
  const rows=e.sets.map((s,j)=>{
    const p=L&&L.ex.sets[j];
    const pt=p?(nw?p.r:(p.w?fmt(p.w):'BW')+' × '+p.r):'–';
    return `<div class="set ${nw?'nw':''} ${s.d?'done':''}"><span class="sn">${j+1}</span><span class="prev">${pt}</span>${nw?'':`<input class="in" inputmode="decimal" data-in="w" data-i="${i}" data-j="${j}" value="${esc(s.w)}" placeholder="${x.bw?'BW':'0'}" aria-label="Weight, set ${j+1}">`}<input class="in" inputmode="numeric" data-in="r" data-i="${i}" data-j="${j}" value="${esc(s.r)}" aria-label="${unitLabel(x)}, set ${j+1}"><button class="chk" data-a="chk" data-i="${i}" data-j="${j}" aria-label="Mark set ${j+1} done">${svg(ico.check,22,3)}</button></div>`}).join('');
  return `<section class="ex"><div class="exh"><div><h3><button class="exname" data-a="exd" data-id="${e.id}">${x.name}${svg('<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',17)}</button></h3><small>${targetLabel(x,e.s,e.r)}</small></div><div class="exa"><button class="mini" data-a="swap" data-i="${i}">Swap</button><button class="mini" data-a="rm" data-i="${i}">Remove</button></div></div>
  ${goalLine(e.id)}${(S.exNotes||{})[e.id]?`<p class="glink"><b>Your note:</b> ${esc(S.exNotes[e.id])}</p>`:''}${e.note?`<p class="hint">${esc(e.note)}</p>`:''}
  <div class="setlab ${nw?'nw':''}"><span></span><span>Last</span>${nw?'':'<span>kg</span>'}<span>${unitLabel(x)}</span><span></span></div>${rows}
  <div class="exf"><button class="mini" data-a="addset" data-i="${i}">Add set</button><button class="mini" data-a="rmset" data-i="${i}">Remove set</button></div></section>`;
}
function vWorkout(){
  const done=W.ex.reduce((a,e)=>a+e.sets.filter(s=>s.d).length,0),total=W.ex.reduce((a,e)=>a+e.sets.length,0);
  return `<div class="wrap wk" style="padding-bottom:170px"><div class="whead"><button class="icon" data-a="wback" aria-label="Back to home">${svg(ico.back)}</button><div class="wt"><b>${esc(W.name)}</b><small><span id="elapsed">${elapsed()}</span>, ${done} of ${total} sets</small></div><button class="fin" data-a="finish">Finish</button></div>
  <div class="prog"><i style="width:${total?Math.round(done/total*100):0}%"></i></div>
  ${done===0&&W.ex.length?'<p class="hint">Tap ✓ after each set to save it and start your rest timer.</p>':''}
  ${W.light?`<p class="hint">Light day. Weights are set to about 60% of your usual.</p>`:''}
  ${W.ex.length?W.ex.map(exCard).join(''):`<div class="empty">No exercises yet. Add one below.</div>`}
  <button class="btn ghost" data-a="addex">Add an exercise</button><div style="height:10px"></div><button class="btn pop" data-a="finish">Finish workout</button></div>`;
}

function vDone(){
  const d=UI.done;if(d.X)return vDone2(d);
  return `<div class="wrap"><h1>Workout saved</h1><p class="lead">${esc(d.log.name)}</p>
  <div class="stat3"><div><b>${d.log.dur}</b><small>minutes</small></div><div><b>${d.sets}</b><small>sets</small></div><div><b>${Math.round(d.vol).toLocaleString()}</b><small>kg lifted</small></div></div>
  ${d.pbs.length?`<h2>New personal bests</h2>`+d.pbs.map(p=>`<div class="pb">${svg(ico.rec,22)}<div><b>${p.name}</b><br><small>${fmt(p.w)} kg × ${p.r}</small></div></div>`).join(''):''}
  ${d.reached&&d.reached.length?`<h2>Goals reached</h2>`+d.reached.map(g=>goalCard(g)).join(''):''}
  <div style="height:14px"></div><button class="btn" data-a="gohome">Back to home</button></div>`;
}

const setsText=e=>e.sets.map(s=>E[e.id].nw?String(s.r):(s.w?fmt(s.w):'BW')+' × '+s.r).join(', ');
function vHistory(){return vHistory2()}
function vHistoryOld(){
  const L=[...S.logs].reverse();
  let h=`<div class="wrap"><h1>Progress</h1>${progSeg()}`;
  if(!L.length)return h+`<div class="empty">No workouts yet. Finish one and it shows up here.</div></div>`;
  h+=`<p class="lead">${S.logs.length} ${S.logs.length===1?'workout':'workouts'} logged.</p>`;
  h+=L.map(l=>{
    const open=UI.openLog===l.id,sets=l.ex.reduce((a,e)=>a+e.sets.length,0);
    return `<div class="card"><button class="hd" data-a="hopen" data-id="${l.id}"><div><h3>${esc(l.name)}</h3><small>${fdate(l.date)}, ${l.dur} min, ${sets} sets</small></div>${svg(open?ico.up:ico.down,20)}</button>
    ${open?`<ul>${l.ex.filter(e=>E[e.id]).map(e=>`<li><b>${E[e.id].name}</b><small>${setsText(e)}</small></li>`).join('')}</ul><div class="two"><button class="btn sm" data-a="repeat" data-id="${l.id}">Repeat workout</button><button class="btn sm ghost" data-a="dellog" data-id="${l.id}">Delete</button></div>`:''}</div>`}).join('');
  return h+`</div>`;
}

function spark(a){
  a=a.slice(-12);if(a.length<2)return '';
  const w=80,h=28,mn=Math.min(...a),mx=Math.max(...a),rg=(mx-mn)||1;
  const pts=a.map((v,i)=>`${(i/(a.length-1)*w).toFixed(1)},${(h-3-(v-mn)/rg*(h-6)).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--pop)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function vRecords(){
  const m={};
  S.logs.forEach(l=>l.ex.forEach(e=>{
    if(!E[e.id])return;
    const o=m[e.id]||(m[e.id]={id:e.id,w:0,e:0,r:0,last:l.date,series:[]});
    const top=Math.max(...e.sets.map(s=>+s.w||0)),topR=Math.max(...e.sets.map(s=>+s.r||0));
    o.w=Math.max(o.w,top);o.r=Math.max(o.r,topR);e.sets.forEach(s=>{o.e=Math.max(o.e,e1(+s.w||0,+s.r||0))});
    o.last=l.date;o.series.push(top||topR);
  }));
  const rows=Object.values(m).sort((a,b)=>b.last.localeCompare(a.last));
  let h=`<div class="wrap"><h1>Progress</h1>${progSeg()}`;
  if(!rows.length)return h+`<div class="empty">No records yet. Your best lifts appear here after your first workout.</div></div>`;
  h+=`<p class="lead">Your best lift for each exercise, and how it’s trending. Tap one for its full history.</p>`;
  h+=rows.map(o=>{const x=E[o.id];const best=x.nw?`Best: ${o.r} ${x.unit==='s'?'sec':'min'}`:o.w>0?`Best: ${fmt(o.w)} kg, estimated 1RM ${Math.round(o.e)} kg`:`Best: ${o.r} reps`;
    return `<button class="card exrow" data-a="exd" data-id="${o.id}"><div class="hd"><div><h3 style="font-size:17px">${x.name}</h3><small>${best}</small><br><small>Last done ${fdate(o.last)}</small></div>${spark(o.series)}</div></button>`}).join('');
  return h+`</div>`;
}

function tabsHTML(){
  const t=[['home','Today',ico.home],['pick','Pick',ico.pick],['food','Food',ico.food],['body','Body',ico.body],['goals','Goals',ico.goal],['progress','Progress',ico.rec]];
  return t.map(([k,l,i])=>`<button class="${UI.view===k?'on':''}" data-a="tab" data-v="${k}">${svg(i,24)}<span>${l}</span></button>`).join('');
}

/* ---------- sheets ---------- */
function sheetBody(s){
  {const xs=featSheet(s);if(xs!=null)return xs;const fs=foodSheet(s);if(fs!=null)return fs;}
  if(s.type==='unticked')return `<h2>${s.n} set${s.n>1?'s':''} not ticked</h2><p class="sub" style="margin-bottom:16px">On ${esc(s.names.join(', '))}. Only ticked sets are saved. Did you do ${s.n>1?'them':'it'}?</p><button class="btn pop" data-a="tickall">Yes, log ${s.n>1?'them':'it'} too</button><div style="height:10px"></div><button class="btn ghost" data-a="onlyticked">No, save only ticked sets</button><div style="height:10px"></div><button class="btn ghost" data-a="closesheet">Back to workout</button>`;
  if(s.type==='cheer')return `<span class="em">${s.em}</span><h2>${esc(s.title)}</h2><p>${esc(s.msg)}</p><button class="btn pop" data-a="closesheet">Keep going</button>`;
  if(s.type==='log'){const m=metric(S.bodySel),l=latest(m.id);return `<h2>Log ${esc(m.name.toLowerCase())}</h2><div class="f2"><div><small>${esc(m.unit||'Value')}</small><input class="field" id="lv" inputmode="decimal" placeholder="${l!=null?'Last: '+fv(l):''}"></div><div><small>Date</small><input class="field" id="ld" type="date" value="${todayISO()}" max="${todayISO()}"></div></div><button class="btn pop" data-a="logsave">Save</button><div style="height:10px"></div><button class="btn ghost" data-a="closesheet">Cancel</button>`}
  if(s.type==='metric'){const sug=[['Waist','cm'],['Hips','cm'],['Glutes','cm'],['Thigh','cm'],['Arm','cm'],['Chest','cm'],['Muscle mass','kg'],['Resting heart rate','bpm']].filter(([n])=>!S.metrics.some(m=>m.name.toLowerCase()===n.toLowerCase()));
    return `<h2>Track something new</h2>${sug.length?`<div class="lab" style="margin-top:0">Quick add</div><div class="chips" style="flex-wrap:wrap">${sug.map(([n,u])=>`<button class="chip" data-a="msug" data-n="${n}" data-u="${u}">${n}</button>`).join('')}</div>`:''}<div class="lab">Or make your own</div><div class="f2"><input class="field" id="mn" placeholder="Name, e.g. Calf"><input class="field" id="mu" placeholder="Unit, e.g. cm"></div><button class="btn pop" data-a="madd">Add</button><div style="height:10px"></div><button class="btn ghost" data-a="closesheet">Cancel</button>`}
  if(s.type==='goal'){const gt=UI.gt;let f='';
    if(gt==='body')f=`<small>Measurement</small><select class="field" id="gm">${S.metrics.map(m=>`<option value="${m.id}" ${m.id===S.bodySel?'selected':''}>${esc(m.name)}${m.unit?' ('+esc(m.unit)+')':''}</option>`).join('')}</select><small>Target</small><input class="field" id="gt" inputmode="decimal" placeholder="e.g. 50">`;
    else if(gt==='lift')f=`<small>Exercise</small><select class="field" id="ge">${Object.values(E).filter(x=>!x.nw).map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select><div class="f2"><div><small>Target kg</small><input class="field" id="gw" inputmode="decimal" placeholder="e.g. 80"></div><div><small>Reps in one set</small><input class="field" id="gr" inputmode="numeric" value="8"></div></div>`;
    else f=`<small>Workouts per week</small><select class="field" id="gn">${[2,3,4,5,6].map(n=>`<option ${n===+S.prog?'selected':''}>${n}</option>`).join('')}</select>`;
    if(gt!=='week')f+=`<small>Deadline (optional)</small><input class="field" id="gd" type="date" min="${todayISO()}">`;
    return `<h2>Set a goal</h2><div class="seg" style="margin-bottom:14px">${[['body','Body'],['lift','Lift'],['week','Weekly']].map(([v,l])=>`<button class="${gt===v?'on':''}" data-a="gtype" data-v="${v}">${l}</button>`).join('')}</div>${f}<button class="btn pop" data-a="goalsave">Save goal</button><div style="height:10px"></div><button class="btn ghost" data-a="closesheet">Cancel</button>`}
  if(s.type==='confirm')return `<h2>${esc(s.msg)}</h2><div class="two"><button class="btn ghost" data-a="closesheet">Cancel</button><button class="btn pop" data-a="cyes">${esc(s.yes)}</button></div>`;
  if(s.type==='swap'){
    const e=W.ex[s.i],x=E[e.id],used=new Set(W.ex.map(z=>z.id));
    const c=Object.values(E).filter(y=>y.id!==x.id&&!used.has(y.id)&&(y.m===x.m||y.also.includes(x.m))).sort((a,b)=>(b.sub===x.sub)-(a.sub===x.sub));
    const warn=e.sets.some(z=>z.d)?`<p class="hint">Sets you’ve already ticked on ${x.name} will be cleared.</p>`:'';
    return `<h2>Swap ${x.name}</h2>${warn}`+(c.length?c.map(y=>`<button class="lib" data-a="dopick" data-id="${y.id}"><span><b>${y.name}</b><small>${y.sub===x.sub?'Closest match':mlabel(y)}</small></span></button>`).join(''):`<div class="empty">No other exercises for this muscle group.</div>`)+`<div style="height:12px"></div><button class="btn ghost" data-a="closesheet">Cancel</button>`;
  }
  if(s.type==='add')return `<h2>Add an exercise</h2>${chipsHTML()}<input class="search" type="search" placeholder="Search exercises" data-in="q" value="${esc(UI.q)}"><button class="btn sm ghost" data-a="cexopen" data-ctx="${s.ctx||'w'}" style="margin-bottom:6px">Create your own exercise</button><div id="lib" data-ctx="${s.ctx||'w'}">${libHTML(s.ctx||'w')}</div><div style="height:12px"></div><button class="btn ghost" data-a="closesheet">Close</button>`;
  if(s.type==='settings')return `<h2>Settings</h2>
  <div class="lab">Rest timer</div><div class="seg">${[[60,'1:00'],[90,'1:30'],[120,'2:00'],[150,'2:30']].map(([v,l])=>`<button class="${S.rest===v?'on':''}" data-a="rest" data-v="${v}">${l}</button>`).join('')}</div>
  <div class="lab">Display colours</div><div class="seg">${[['auto','Auto'],['dark','Dark'],['light','Light'],['custom','Custom']].map(([v,l])=>`<button class="${S.theme===v?'on':''}" data-a="theme" data-v="${v}">${l}</button>`).join('')}</div>${S.theme==='custom'?customPanel():''}
  <div class="lab">Backup</div><p class="sub" style="margin-bottom:8px">Your data lives only on this phone. ${S.lastBackup?`Last backup: ${fday(S.lastBackup)}.`:'You haven’t made a backup yet.'} Copy a backup and paste it into a note in Notes. To restore, paste the whole note below and tap Restore.</p>
  <button class="btn sm pop" data-a="bkcopy">Copy backup for Notes</button><div style="height:10px"></div>
  <textarea id="bk" rows="3" placeholder="Paste a backup here to restore"></textarea>
  <button class="btn sm ghost" data-a="restore">Restore from text</button>
  <div style="height:16px"></div><button class="btn" data-a="closesheet">Done</button><div style="height:12px"></div><button class="btn sm ghost danger" data-a="reset">Erase all data</button>`;
  return '';
}
function renderSheet(){
  const el=$('#sheet'),s=UI.sheet;
  if(!s){el.innerHTML='';document.body.style.overflow='';SHO=null;return}
  document.body.style.overflow='hidden';
  const c=s.type==='cheer'?' center':'';
  el.innerHTML=`<div class="sheetbg${c}${SHO?'':' enter'}" data-a="closesheet"><div class="sheet${c?' cheer':''}" role="dialog" aria-modal="true">${sheetBody(s)}</div></div>`;SHO=s.type;
}

/* ---------- render ---------- */
function render(){
  const y=window.scrollY;let h='';
  switch(UI.view){
    case 'home':h=vHome();break;case 'pick':h=vPick();break;case 'food':h=vFood();break;case 'body':h=vBody();break;case 'goals':h=vGoals();break;case 'progress':h=UI.ptab==='records'?vRecords():vHistory();break;
    case 'builder':h=B?vBuilder():vPick();break;case 'workout':h=W?vWorkout():vHome();break;case 'done':h=UI.done?vDone():vHome();break;case 'logedit':h=UI.LE?vLogEdit():vHistory();break;
  }
  $('#app').innerHTML=h;
  if(lastView!==UI.view&&$('#app').firstElementChild)$('#app').firstElementChild.classList.add('enter');
  const tabs=['home','pick','food','body','goals','progress'].includes(UI.view);
  const tb=$('#tabs');tb.style.display=tabs?'flex':'none';tb.innerHTML=tabs?tabsHTML():'';
  window.scrollTo(0,lastView===UI.view?y:0);lastView=UI.view;
  renderSheet();renderTimer();
}

/* ---------- actions ---------- */
function act(a,d,t,ev){
  switch(a){
    case 'hbody':S.bodySel='weight';UI.view='body';render();break;
    case 'hlogw':{S.bodySel='weight';UI.sheet={type:'log'};renderSheet();const i=$('#lv');if(i)i.focus();break}
    case 'tab':if(d.v!==UI.view)UI.fd=null;UI.view=d.v;UI.openLog=null;render();if(d.v==='food')loadProducts();break;
    case 'gohome':UI.view='home';render();break;
    case 'tipoff':S.tipOff=true;save();render();break;
    case 'prog':S.prog=d.p;save();render();break;
    case 'startplan':{const day=PROGRAMS[S.prog].days[+d.d];begin(makeWorkout(day.name,day.ex,{src:'plan',prog:S.prog,dayIdx:+d.d}));break}
    case 'startq':{const q=QUICK[+d.i];begin(makeWorkout(q.name,q.ex,{src:'pick',light:!!q.light}));break}
    case 'editq':{const q=QUICK[+d.i];B={name:q.name,items:q.ex.map(z=>({...z}))};UI.f='all';UI.q='';UI.view='builder';render();break}
    case 'build':B={name:'My workout',items:[]};UI.f='all';UI.q='';UI.view='builder';render();break;
    case 'bback':UI.view='pick';render();break;
    case 'badd':{const i=B.items.findIndex(z=>z.id===d.id);if(i>=0)B.items.splice(i,1);else B.items.push({id:d.id,s:3,r:defR(E[d.id])});render();break}
    case 'bup':{const i=+d.i;if(i>0){[B.items[i-1],B.items[i]]=[B.items[i],B.items[i-1]];render()}break}
    case 'bdown':{const i=+d.i;if(i<B.items.length-1){[B.items[i+1],B.items[i]]=[B.items[i],B.items[i+1]];render()}break}
    case 'brm':B.items.splice(+d.i,1);render();break;
    case 'bstart':if(B.items.length)begin(makeWorkout(B.name.trim()||'My workout',B.items,{src:'build'}));break;
    case 'filt':UI.f=d.m;document.querySelectorAll('.chip[data-m]').forEach(c=>c.classList.toggle('on',c.dataset.m===d.m));refreshLib();break;
    case 'resume':UI.view='workout';wake();render();break;
    case 'wback':UI.view='home';render();break;
    case 'discardask':UI.sheet={type:'confirm',msg:'Discard this workout? Logged sets will be lost.',yes:'Discard',fn:discard};renderSheet();break;
    case 'deload':S.deloadFor=weekNo();save();render();break;
    case 'deloadskip':S.deloadSkip=weekNo();save();render();break;
    case 'chk':{const s=W.ex[+d.i].sets[+d.j];
      if(!s.d){if(!String(s.r).trim()){t.closest('.set').querySelector('[data-in="r"]').focus();break}s.d=true;if(!E[W.ex[+d.i].id].nw||true)startRest()}else s.d=false;
      saveW();render();break}
    case 'addset':{const e=W.ex[+d.i],l=e.sets[e.sets.length-1]||{w:'',r:'10'};e.sets.push({w:l.w,r:l.r,d:false});saveW();render();break}
    case 'rmset':{const e=W.ex[+d.i];if(e.sets.length>1){e.sets.pop();saveW();render()}break}
    case 'swap':UI.sheet={type:'swap',i:+d.i};renderSheet();break;
    case 'dopick':{const e=W.ex[UI.sheet.i],sg=suggest(d.id,e.s,e.r,W.light);W.ex[UI.sheet.i]={id:d.id,s:e.s,r:e.r,note:sg.note,sets:sg.sets};UI.sheet=null;saveW();render();break}
    case 'rm':{const i=+d.i,e=W.ex[i];const doIt=()=>{W.ex.splice(i,1);saveW()};
      if(e.sets.some(s=>s.d)){UI.sheet={type:'confirm',msg:`Remove ${E[e.id].name}? Its ticked sets will be lost.`,yes:'Remove',fn:doIt};renderSheet()}else{doIt();render()}break}
    case 'addex':UI.f='all';UI.q='';UI.sheet={type:'add'};renderSheet();break;
    case 'wadd':{const x=E[d.id],r=defR(x),sg=suggest(x.id,3,r,W.light);W.ex.push({id:x.id,s:3,r,note:sg.note,sets:sg.sets});UI.sheet=null;saveW();render();window.scrollTo(0,document.body.scrollHeight);break}
    case 'finish':
      if(finishCheck())break;
      if(!W.ex.some(e=>e.sets.some(s=>s.d))){UI.sheet={type:'confirm',msg:'You haven’t ticked off any sets. Discard this workout?',yes:'Discard',fn:discard};renderSheet()}
      else finishWorkout();
      break;
    case 'hopen':UI.openLog=UI.openLog===d.id?null:d.id;render();break;
    case 'repeat':{const l=S.logs.find(z=>z.id===d.id);if(l){UI.view='home';begin(makeWorkout(l.name,l.ex.filter(e=>E[e.id]).map(e=>({id:e.id,s:e.sets.length,r:defR(E[e.id])})),{src:'pick'}))}break}
    case 'dellog':UI.sheet={type:'confirm',msg:'Delete this workout from your history?',yes:'Delete',fn:()=>{S.logs=S.logs.filter(z=>z.id!==d.id);UI.openLog=null;if(UI.view==='logedit'){UI.LE=null;UI.view='progress'}save()}};renderSheet();break;
    case 'settings':UI.sheet={type:'settings'};renderSheet();break;
    case 'rest':S.rest=+d.v;save();renderSheet();break;
    case 'theme':S.theme=d.v;save();applyTheme();renderSheet();break;
    case 'backup':{const b=$('#bk');b.value=JSON.stringify(S);b.focus();b.select();break}
    case 'restore':{const raw=$('#bk').value,a0=raw.indexOf('{'),b0=raw.lastIndexOf('}');let j=null;try{j=JSON.parse(raw.slice(a0,b0+1))}catch(e){j=null}
      if(!j||!Array.isArray(j.logs)){UI.sheet={type:'cheer',em:'📋',title:'That isn’t a Lift backup',msg:'Paste the whole backup note, from “Lift backup” to the last character, then tap Restore again.'};renderSheet();break}
      UI.sheet={type:'confirm',msg:`Replace everything on this phone with the backup (${j.logs.length} workouts)?`,yes:'Restore',fn:()=>{S=Object.assign(defaults(),j);fixFood();loadCustomEx();save();applyTheme();UI.view='home'}};renderSheet();break}
    case 'reset':UI.sheet={type:'confirm',msg:'Erase every workout and setting on this phone? This can’t be undone.',yes:'Erase everything',fn:()=>{S=defaults();save();W=null;saveW();T=null;applyTheme();UI.view='home'}};renderSheet();break;
    case 'cyes':{const fn=UI.sheet&&UI.sheet.fn;UI.sheet=null;if(fn)fn();render();break}
    case 'closesheet':{if(t.classList.contains('sheetbg')&&ev.target!==t)return;const wx=UI.sheet&&UI.sheet.type==='exd';UI.sheet=null;renderSheet();if(wx&&UI.view==='workout')render();break}
    case 'ptab':UI.ptab=d.v;UI.openLog=null;render();break;
    case 'bsel':S.bodySel=d.id;save();render();break;
    case 'logopen':{UI.sheet={type:'log'};renderSheet();const i=$('#lv');if(i)i.focus();break}
    case 'logsave':{const raw=$('#lv').value.trim(),v=parseW(raw);if(!raw||!(v>0)){$('#lv').focus();break}
      const id=S.bodySel,dt=$('#ld').value||todayISO(),arr=S.entries[id]||(S.entries[id]=[]),k=arr.findIndex(x=>x.d===dt);
      if(k>=0)arr[k].v=v;else arr.push({d:dt,v});
      let c=cheerFor(id,v,dt);
      S.goals.forEach(g=>{if(!g.done&&g.type==='body'&&g.metric===id&&goalInfo(g).hit){g.done=todayISO();const m=metric(id);c={em:'🏆',title:'Goal reached!',msg:kid(`You hit your ${m.name.toLowerCase()} goal of ${fv(g.target)} ${m.unit}. That took real consistency. Set a new one whenever you’re ready.`,'proud')}}});
      save();UI.sheet=Object.assign({type:'cheer'},c);render();break}
    case 'entdel':{const id=S.bodySel;UI.sheet={type:'confirm',msg:`Delete the entry from ${fday(d.d)}?`,yes:'Delete',fn:()=>{S.entries[id]=(S.entries[id]||[]).filter(x=>x.d!==d.d);save()}};renderSheet();break}
    case 'newmetric':UI.sheet={type:'metric'};renderSheet();break;
    case 'msug':addMetric(d.n,d.u);break;
    case 'madd':{const n=$('#mn').value.trim(),u=$('#mu').value.trim();if(!n){$('#mn').focus();break}addMetric(n,u);break}
    case 'metricdel':{const id=S.bodySel,m=metric(id);UI.sheet={type:'confirm',msg:`Stop tracking ${m.name}? Its entries and goals will be deleted.`,yes:'Delete',fn:()=>{S.metrics=S.metrics.filter(x=>x.id!==id);delete S.entries[id];S.goals=S.goals.filter(g=>!(g.type==='body'&&g.metric===id));S.bodySel='weight';save()}};renderSheet();break}
    case 'goalnew':if(d.gt)UI.gt=d.gt;UI.sheet={type:'goal'};renderSheet();break;
    case 'gtype':UI.gt=d.v;renderSheet();break;
    case 'goalsave':{const gt=UI.gt,g={id:Date.now().toString(36),type:gt,created:todayISO(),done:null,due:null};
      if(gt==='body'){g.metric=$('#gm').value;g.target=parseW($('#gt').value);if(!(g.target>0)){$('#gt').focus();break}g.start=latest(g.metric)}
      else if(gt==='lift'){g.ex=$('#ge').value;g.w=parseW($('#gw').value);g.r=Math.max(1,parseInt($('#gr').value)||8);if(!(g.w>0)){$('#gw').focus();break}g.start=bestAtReps(g.ex,g.r)}
      else{g.n=+$('#gn').value||3;S.goals=S.goals.filter(x=>x.type!=='week')}
      const gd=$('#gd');if(gd&&gd.value)g.due=gd.value;
      S.goals.push(g);
      const inf=goalInfo(g);let c;
      if(gt!=='week'&&inf.hit){g.done=todayISO();c={em:'🏆',title:'Already there!',msg:`You’ve already reached ${inf.title}, so it’s marked as achieved. Maybe aim a little higher?`}}
      else c={em:'🎯',title:'Goal set',msg:gt==='week'?`Aiming for ${g.n} workouts a week. It updates every time you finish a session.`:`${inf.title}. Progress updates automatically as you ${gt==='lift'?'log workouts':'log measurements'}.`};
      save();UI.sheet=Object.assign({type:'cheer'},c);render();break}
    case 'gdel':UI.sheet={type:'confirm',msg:'Remove this goal?',yes:'Remove',fn:()=>{S.goals=S.goals.filter(g=>g.id!==d.id);save()}};renderSheet();break;
    case 'cbase':S.custom.base=d.v;save();applyTheme();renderSheet();break;
    case 'cpreset':{const p=PRESETS[+d.i];S.custom.main=p[1];S.custom.accent=p[2];save();applyTheme();renderSheet();break}
    case 'tickall':W.ex.forEach(e=>e.sets.forEach(s=>{if(String(s.r).trim()!=='')s.d=true}));UI.sheet=null;saveW();finishWorkout();break;
    case 'onlyticked':UI.sheet=null;if(!W.ex.some(e=>e.sets.some(s=>s.d))){UI.sheet={type:'confirm',msg:'No sets were ticked, so there’s nothing to save. Discard this workout?',yes:'Discard',fn:discard};renderSheet()}else finishWorkout();break;
    case 'calday':UI.calDay=UI.calDay===d.k?null:d.k;render();break;
    case 'calm':{const m=UI.calM;UI.calM=new Date(m.getFullYear(),m.getMonth()+(+d.v),1);render();break}
    case 'calclear':UI.calDay=null;render();break;
    case 'tadd':if(T){T.end+=15000;renderTimer()}break;
    case 'tsub':if(T){T.end-=15000;renderTimer()}break;
    case 'tskip':T=null;renderTimer();break;
    default:if(!featAct(a,d,t,ev))foodAct(a,d,t,ev);
  }
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;act(t.dataset.a,t.dataset,t,e)});
document.addEventListener('input',e=>{
  const t=e.target,k=t.dataset&&t.dataset.in;if(!k)return;
  if(featInput(k,t))return;
  if(foodInput(k,t))return;
  const i=+t.dataset.i,j=+t.dataset.j;
  if((k==='w'||k==='r')&&W){W.ex[i].sets[j][k]=t.value;saveW()}
  else if(k==='bs'&&B)B.items[i].s=Math.max(1,Math.min(10,+t.value||1));
  else if(k==='br'&&B)B.items[i].r=t.value.trim()||'10';
  else if(k==='bname'&&B)B.name=t.value;
  else if(k==='q'){UI.q=t.value;refreshLib()}
  else if(k==='cmain'||k==='cacc'){S.custom[k==='cmain'?'main':'accent']=t.value;save();applyTheme();document.querySelectorAll('.swb.on').forEach(b=>b.classList.remove('on'))}
});

document.getElementById('fcam').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)handleScanFile(f)});
applyTheme();
render();
})();
</script>
